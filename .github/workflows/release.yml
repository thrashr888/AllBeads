name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: allbeads
            asset_name: allbeads-linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: allbeads
            asset_name: allbeads-linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: allbeads
            asset_name: allbeads-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: allbeads
            asset_name: allbeads-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: allbeads
            asset_name: allbeads-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: allbeads.exe
            asset_name: allbeads-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [[ "$name" == *".exe" ]]; then
              cp "$dir"/* "release/$name"
            else
              cp "$dir"/* "release/$name"
              chmod +x "release/$name"
            fi
          done
          ls -la release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 sums
        id: sha
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          curl -sL "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-macos-aarch64" -o allbeads-macos-aarch64
          curl -sL "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-macos-x86_64" -o allbeads-macos-x86_64
          curl -sL "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-linux-aarch64" -o allbeads-linux-aarch64
          curl -sL "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-linux-x86_64" -o allbeads-linux-x86_64
          echo "macos_aarch64=$(sha256sum allbeads-macos-aarch64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(sha256sum allbeads-macos-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_aarch64=$(sha256sum allbeads-linux-aarch64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum allbeads-linux-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate and push Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          SHA_MACOS_AARCH64: ${{ steps.sha.outputs.macos_aarch64 }}
          SHA_MACOS_X86_64: ${{ steps.sha.outputs.macos_x86_64 }}
          SHA_LINUX_AARCH64: ${{ steps.sha.outputs.linux_aarch64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > allbeads.rb << FORMULA
          class Allbeads < Formula
            desc "Distributed protocol for agentic orchestration and communication"
            homepage "https://github.com/thrashr888/AllBeads"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-macos-aarch64"
                sha256 "${SHA_MACOS_AARCH64}"
              end
              on_intel do
                url "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-macos-x86_64"
                sha256 "${SHA_MACOS_X86_64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-linux-aarch64"
                sha256 "${SHA_LINUX_AARCH64}"
              end
              on_intel do
                url "https://github.com/thrashr888/AllBeads/releases/download/${TAG_NAME}/allbeads-linux-x86_64"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install Dir["allbeads*"].first => "allbeads"
            end

            test do
              system "#{bin}/allbeads", "--version"
            end
          end
          FORMULA

          git clone "https://x-access-token:${GH_TOKEN}@github.com/thrashr888/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp allbeads.rb /tmp/homebrew-tap/Formula/allbeads.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/allbeads.rb
          git commit -m "Update allbeads to ${TAG_NAME}"
          git push
